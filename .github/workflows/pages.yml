name: Publish the randomizer page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZORA_REPO: Ultralavos/zora
  ZORA_REF: 8c1ab298b61c7d91fc56bd456abc252212505abd   # the ZORA the build is made against

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ZORA_REPO }}
          ref: ${{ env.ZORA_REF }}
          path: zora
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pack the build for the page
        run: python3 scripts/package_build.py zora
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
